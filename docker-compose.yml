services:

  app:
    build:
      context: .
      dockerfile: ./go/Dockerfile
    environment:
      - TZ=Kazakhstan/Astana
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports: 
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./:/app
    command: air
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - 5432:5432
    volumes:
     - postgres:/var/lib/postgresql/data 

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DESIGN: dracula
    ports:
      - 3333:8080

volumes:
  postgres:
